<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>POC — Trail d'Ath Aïssi (Yakouren)</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/4.7.1/maplibre-gl.css">
<style>
  :root {
    --bg: #0e1411;
    --panel: #16201b;
    --line: #2a3a31;
    --fg: #e8efe9;
    --muted: #93a79a;
    --accent: #e4572e;
    --ok: #4caf72;
    --warn: #e0a33e;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--fg);
    font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
    display: flex; flex-direction: column;
  }
  header {
    display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px 16px;
    padding: 10px 16px; border-bottom: 1px solid var(--line); background: var(--panel);
  }
  header h1 { font-size: 15px; margin: 0; font-weight: 600; letter-spacing: .01em; }
  header .meta { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
  header .meta b { color: var(--fg); font-weight: 600; }
  #map { flex: 1 1 auto; min-height: 45vh; }
  .controls {
    display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
    padding: 8px 16px; border-top: 1px solid var(--line); background: var(--panel);
  }
  button {
    background: #22302a; color: var(--fg); border: 1px solid var(--line);
    border-radius: 6px; padding: 6px 12px; font: inherit; cursor: pointer;
  }
  button:hover { border-color: var(--muted); }
  button.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  label { color: var(--muted); font-size: 12px; display: flex; align-items: center; gap: 6px; }
  input[type=range] { accent-color: var(--accent); width: 110px; }
  .bandeau-profil { background: var(--panel); border-top: 1px solid var(--line); }
  .bandeau-profil.replie .profil,
  .bandeau-profil.replie .note { display: none; }
  .entete-profil {
    display: flex; align-items: center; gap: 10px; width: 100%;
    padding: 9px 16px; background: #1d2a23; border: 0; border-bottom: 1px solid var(--line);
    border-radius: 0; color: var(--fg); font: inherit; font-size: 13px; font-weight: 600;
    text-align: left; cursor: pointer;
  }
  .entete-profil:hover { background: #24332b; }
  .entete-profil .resume { font-weight: 400; color: var(--muted); }
  .entete-profil .chevron {
    display: inline-flex; align-items: center; justify-content: center;
    width: 20px; height: 20px; border-radius: 4px; background: var(--accent); color: #fff;
    font-size: 11px; transition: transform .2s;
  }
  .bandeau-profil.replie .entete-profil .chevron { transform: rotate(-90deg); }
  .entete-profil .resume { margin-left: auto; font-variant-numeric: tabular-nums; }
  .profil { padding: 6px 8px 4px; }
  .profil svg { display: block; width: 100%; height: auto; max-height: 32vh; margin: 0 auto; }
  .cp-marker {
    width: 13px; height: 13px; border-radius: 3px; background: var(--accent);
    border: 2px solid #fff; box-shadow: 0 0 0 1px rgba(0,0,0,.5); cursor: pointer;
  }
  .cp-marker.depart { background: var(--ok); border-radius: 50%; }
  .runner {
    width: 16px; height: 16px; border-radius: 50%; background: #3da5f5;
    border: 2px solid #fff; box-shadow: 0 0 10px rgba(61,165,245,.9);
  }
  .curseur { width: 12px; height: 12px; border-radius: 50%; background: #fff; border: 2px solid var(--accent); }
  .maplibregl-popup-content {
    background: var(--panel); color: var(--fg); border: 1px solid var(--line);
    font: 12px/1.4 system-ui, sans-serif; padding: 8px 10px;
  }
  .maplibregl-popup-content b { display: block; margin-bottom: 2px; }
  .maplibregl-popup-tip { border-top-color: var(--line) !important; }
  .note { color: var(--muted); font-size: 11px; padding: 0 16px 10px; }
</style>
</head>
<body>

<header>
  <h1 id="m-nom">Parcours</h1>
  <span class="meta">
    <b id="m-dist">—</b> ·
    D+ <b id="m-dplus">—</b> ·
    D− <b id="m-dmoins">—</b> ·
    alt <b id="m-alt">—</b>
    <span id="m-duree"></span>
  </span>
  <span class="meta" id="m-source"></span>
</header>

<div id="map"></div>

<div class="controls">
  <button id="btn-3d" class="on">Vue 3D</button>
  <button id="btn-survol">Survol du parcours</button>
  <button id="btn-live">Coureur live (simulé)</button>
  <label>Relief ×<span id="exag-val">1.6</span>
    <input type="range" id="exag" min="1" max="3" step="0.1" value="1.6">
  </label>
  <label>Fond
    <select id="fond" style="background:#22302a;color:inherit;border:1px solid var(--line);border-radius:6px;padding:4px">
      <option value="sat">Satellite</option>
      <option value="topo">Topo</option>
    </select>
  </label>
</div>

<div class="bandeau-profil" id="bandeau-profil">
  <button class="entete-profil" id="btn-profil" aria-expanded="true" aria-controls="profil">
    <span class="chevron" aria-hidden="true">▼</span>
    <span class="libelle">Masquer le profil</span>
    <span class="resume" id="resume-profil"></span>
  </button>
  <div class="profil">
    <svg id="profil" viewBox="0 0 1000 300" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Profil altimétrique du parcours"></svg>
  </div>
  <p class="note" id="note">Relief : AWS Terrain Tiles (Mapzen terrarium, ~30 m). Image : Esri World Imagery. Profil calculé hors-ligne depuis le même MNT.</p>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/4.7.1/maplibre-gl.js"></script>
<script src="parcours-data.js"></script>
<script>
const P = window.PARCOURS;
const coords2d = P.coords.map(c => [c[0], c[1]]);

// ---------- en-tête ----------
document.getElementById('m-nom').textContent = P.nom + (P.commune ? ' — ' + P.commune : '');
document.getElementById('m-source').textContent = P.source || '';
if (P.duree_s) {
  const h = Math.floor(P.duree_s / 3600), m = Math.floor((P.duree_s % 3600) / 60);
  document.getElementById('m-duree').textContent = ` · parcouru en ${h} h ${String(m).padStart(2, '0')}`;
}
document.getElementById('m-dist').textContent = (P.distance_m / 1000).toFixed(1) + ' km';
document.getElementById('m-dplus').textContent = P.dplus + ' m';
document.getElementById('m-dmoins').textContent = P.dmoins + ' m';
document.getElementById('m-alt').textContent = P.alt_min + '–' + P.alt_max + ' m';

document.getElementById('resume-profil').textContent =
  `${(P.distance_m / 1000).toFixed(1)} km · +${P.dplus} m · ${P.checkpoints.length} points de passage`;

// ---------- repli du bandeau profil ----------
const bandeau = document.getElementById('bandeau-profil');
document.getElementById('btn-profil').addEventListener('click', e => {
  const replie = bandeau.classList.toggle('replie');
  e.currentTarget.setAttribute('aria-expanded', String(!replie));
  e.currentTarget.querySelector('.libelle').textContent = replie ? 'Afficher le profil' : 'Masquer le profil';
  map.resize();
});

// ---------- carte ----------
const style = {
  version: 8,
  glyphs: 'https://fonts.openmaptiles.org/{fontstack}/{range}.pbf',
  sources: {
    sat: {
      type: 'raster', tileSize: 256, maxzoom: 18,
      tiles: ['https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}'],
      attribution: '© Esri, Maxar, Earthstar Geographics'
    },
    topo: {
      type: 'raster', tileSize: 256, maxzoom: 17,
      tiles: ['https://a.tile.opentopomap.org/{z}/{x}/{y}.png'],
      attribution: '© OpenTopoMap, © OpenStreetMap contributors'
    },
    dem: {
      type: 'raster-dem', tileSize: 256, maxzoom: 15, encoding: 'terrarium',
      tiles: ['https://s3.amazonaws.com/elevation-tiles-prod/terrarium/{z}/{x}/{y}.png'],
      attribution: 'Mapzen Terrain Tiles / AWS'
    },
    trace: { type: 'geojson', data: { type: 'Feature', geometry: { type: 'LineString', coordinates: coords2d } } }
  },
  layers: [
    { id: 'fond-sat', type: 'raster', source: 'sat' },
    { id: 'fond-topo', type: 'raster', source: 'topo', layout: { visibility: 'none' } },
    { id: 'trace-halo', type: 'line', source: 'trace',
      layout: { 'line-cap': 'round', 'line-join': 'round' },
      paint: { 'line-color': '#000', 'line-opacity': 0.5, 'line-width': 8 } },
    { id: 'trace', type: 'line', source: 'trace',
      layout: { 'line-cap': 'round', 'line-join': 'round' },
      paint: { 'line-color': '#e4572e', 'line-width': 4 } }
  ],
  sky: { 'sky-color': '#86b4e0', 'horizon-color': '#cfe0ef', 'fog-color': '#dbe6ef', 'fog-ground-blend': 0.6 }
};

const map = new maplibregl.Map({
  container: 'map', style,
  center: [P.coords[0][0], P.coords[0][1]],
  zoom: 13, pitch: 62, bearing: -25, maxPitch: 80, hash: false
});
map.addControl(new maplibregl.NavigationControl({ visualizePitch: true }), 'top-right');
map.addControl(new maplibregl.ScaleControl({ unit: 'metric' }));

let exageration = 1.6;
map.on('load', () => {
  map.setTerrain({ source: 'dem', exaggeration: exageration });
  const b = coords2d.reduce((bb, c) => bb.extend(c), new maplibregl.LngLatBounds(coords2d[0], coords2d[0]));
  map.fitBounds(b, { padding: 60, pitch: 62, bearing: -25, duration: 0 });
  ajouterCheckpoints();
});

// ---------- checkpoints ----------
const ICONES = { chrono: '⏱', eau: '💧', solide: '🍽', medical: '✚', bus: '🚌', wc: '🚻', repas: '🍲' };
function ajouterCheckpoints() {
  P.checkpoints.forEach((cp, i) => {
    const el = document.createElement('div');
    el.className = 'cp-marker' + (i === 0 ? ' depart' : '');
    const services = cp.services.map(s => ICONES[s] || s).join(' ');
    const seg = cp.dplus_segment != null
      ? `<br>segment : ${cp.km_segment} km · +${cp.dplus_segment} m`
      : '';
    new maplibregl.Marker({ element: el, anchor: 'bottom' })
      .setLngLat([cp.lon, cp.lat])
      .setPopup(new maplibregl.Popup({ offset: 14 }).setHTML(
        `<b>${cp.nom}</b>km ${cp.km} · ${cp.alt} m<br>${services}${seg}`))
      .addTo(map);
  });
}

// ---------- profil altimétrique ----------
const W = 1000, H = 300, ML = 54, MR = 16, MT = 46, MB = 54;
const iw = W - ML - MR, ih = H - MT - MB;
const dmax = P.distance_m;
const mnt = P.profile_mnt || null;
const basMin = mnt ? Math.min(P.alt_min, ...mnt) : P.alt_min;
const hautMax = mnt ? Math.max(P.alt_max, ...mnt) : P.alt_max;
const amin = Math.floor(basMin / 100) * 100, amax = Math.ceil(hautMax / 100) * 100;
const X = d => ML + (d / dmax) * iw;
const Y = a => MT + ih - ((a - amin) / (amax - amin)) * ih;

function pente(i) {
  const a = P.profile[Math.max(0, i - 1)], b = P.profile[Math.min(P.profile.length - 1, i + 1)];
  const dd = b[0] - a[0];
  return dd > 0 ? (b[1] - a[1]) / dd * 100 : 0;
}
function couleurPente(p) {
  const ap = Math.abs(p);
  if (ap < 5) return '#4caf72';
  if (ap < 12) return '#9fc93c';
  if (ap < 20) return '#e0a33e';
  return '#e4572e';
}

function dessinerProfil() {
  const svg = document.getElementById('profil');
  let s = '';

  // grille + axe altitudes
  for (let a = amin; a <= amax; a += 200) {
    s += `<line x1="${ML}" y1="${Y(a)}" x2="${W - MR}" y2="${Y(a)}" stroke="#2a3a31" stroke-width="1"/>`;
    s += `<text x="${ML - 8}" y="${Y(a) + 4}" fill="#93a79a" font-size="12" text-anchor="end">${a} m</text>`;
  }

  // aire sous la courbe, découpée par couleur de pente
  for (let i = 0; i < P.profile.length - 1; i++) {
    const [d1, a1] = P.profile[i], [d2, a2] = P.profile[i + 1];
    const c = couleurPente(pente(i));
    s += `<path d="M${X(d1)} ${Y(a1)} L${X(d2)} ${Y(a2)} L${X(d2)} ${MT + ih} L${X(d1)} ${MT + ih} Z" fill="${c}" fill-opacity="0.22" stroke="none"/>`;
    s += `<line x1="${X(d1)}" y1="${Y(a1)}" x2="${X(d2)}" y2="${Y(a2)}" stroke="${c}" stroke-width="2.5" stroke-linecap="round"/>`;
  }

  // altitude lue dans le MNT terrarium, pour comparaison avec le baromètre de la montre
  if (mnt) {
    const d = mnt.map((a, i) => `${i ? 'L' : 'M'}${X(P.profile[i][0])} ${Y(a)}`).join(' ');
    s += `<path d="${d}" fill="none" stroke="#7fa7c4" stroke-width="1.6" stroke-dasharray="5 4" opacity="0.85"/>`;
    s += `<g transform="translate(${ML + 10}, ${MT + 14})">
            <line x1="0" y1="-4" x2="22" y2="-4" stroke="#7fa7c4" stroke-width="1.6" stroke-dasharray="5 4"/>
            <text x="28" y="0" font-size="11" fill="#93a79a">MNT terrarium (~30 m)</text>
            <line x1="0" y1="12" x2="22" y2="12" stroke="#9fc93c" stroke-width="2.5"/>
            <text x="28" y="16" font-size="11" fill="#93a79a">baromètre de la montre</text>
          </g>`;
  }

  // checkpoints : trait vertical, pastille, libellé
  P.checkpoints.forEach((cp, i) => {
    const d = cp.km * 1000, x = X(d), y = Y(cp.alt);
    s += `<line x1="${x}" y1="${MT - 10}" x2="${x}" y2="${MT + ih}" stroke="#93a79a" stroke-width="1" stroke-dasharray="3 3"/>`;
    s += `<rect x="${x - 5}" y="${y - 5}" width="10" height="10" rx="2" fill="${i === 0 ? '#4caf72' : '#e4572e'}" stroke="#fff" stroke-width="1.5"/>`;
    const anchor = i === 0 ? 'start' : (i === P.checkpoints.length - 1 ? 'end' : 'middle');
    s += `<text x="${x}" y="${MT + ih + 20}" fill="#e8efe9" font-size="12" text-anchor="${anchor}">${cp.km} km</text>`;
    s += `<text x="${x}" y="${MT + ih + 36}" fill="#93a79a" font-size="11" text-anchor="${anchor}">${cp.nom}</text>`;
    if (cp.dplus_segment != null) {
      const xPrev = X(P.checkpoints[i - 1].km * 1000);
      s += `<text x="${(x + xPrev) / 2}" y="${MT - 18}" fill="#93a79a" font-size="11" text-anchor="middle">${cp.km_segment} km · +${cp.dplus_segment} m</text>`;
    }
  });

  // curseur de survol
  s += `<g id="curseur" style="display:none">
          <line y1="${MT - 10}" y2="${MT + ih}" stroke="#fff" stroke-width="1"/>
          <circle r="5" fill="#fff" stroke="#e4572e" stroke-width="2"/>
          <rect rx="4" fill="#16201b" stroke="#2a3a31" width="112" height="34"/>
          <text font-size="12" fill="#e8efe9"></text>
          <text font-size="11" fill="#93a79a" dy="14"></text>
        </g>`;

  svg.innerHTML = s;
}
dessinerProfil();

// ---------- synchro profil ↔ carte ----------
const curseurMarker = new maplibregl.Marker({ element: Object.assign(document.createElement('div'), { className: 'curseur' }) });
let curseurPose = false;

function indexDepuisDistance(d) {
  let lo = 0, hi = P.profile.length - 1;
  while (lo < hi) { const mid = (lo + hi) >> 1; if (P.profile[mid][0] < d) lo = mid + 1; else hi = mid; }
  return lo;
}

const svg = document.getElementById('profil');
svg.addEventListener('pointermove', e => {
  const r = svg.getBoundingClientRect();
  const x = ((e.clientX - r.left) / r.width) * W;
  if (x < ML || x > W - MR) return;
  const d = ((x - ML) / iw) * dmax;
  const i = indexDepuisDistance(d);
  const [dd, aa] = P.profile[i];
  const g = document.getElementById('curseur');
  g.style.display = '';
  g.querySelector('line').setAttribute('x1', X(dd));
  g.querySelector('line').setAttribute('x2', X(dd));
  g.querySelector('circle').setAttribute('cx', X(dd));
  g.querySelector('circle').setAttribute('cy', Y(aa));
  const bx = Math.min(W - MR - 112, Math.max(ML, X(dd) - 56));
  const rect = g.querySelector('rect');
  rect.setAttribute('x', bx); rect.setAttribute('y', MT - 46);
  const t = g.querySelectorAll('text');
  t[0].setAttribute('x', bx + 8); t[0].setAttribute('y', MT - 30);
  t[0].textContent = (dd / 1000).toFixed(2) + ' km · ' + Math.round(aa) + ' m';
  t[1].setAttribute('x', bx + 8); t[1].setAttribute('y', MT - 30);
  t[1].textContent = 'pente ' + pente(i).toFixed(1) + ' %';
  curseurMarker.setLngLat([P.coords[i][0], P.coords[i][1]]);
  if (!curseurPose) { curseurMarker.addTo(map); curseurPose = true; }
});
svg.addEventListener('pointerleave', () => {
  document.getElementById('curseur').style.display = 'none';
  if (curseurPose) { curseurMarker.remove(); curseurPose = false; }
});

// ---------- contrôles ----------
const btn3d = document.getElementById('btn-3d');
btn3d.addEventListener('click', () => {
  const en3d = !btn3d.classList.contains('on');
  btn3d.classList.toggle('on', en3d);
  map.easeTo({ pitch: en3d ? 62 : 0, bearing: en3d ? -25 : 0, duration: 800 });
  map.setTerrain(en3d ? { source: 'dem', exaggeration: exageration } : null);
});

document.getElementById('exag').addEventListener('input', e => {
  exageration = parseFloat(e.target.value);
  document.getElementById('exag-val').textContent = exageration.toFixed(1);
  if (btn3d.classList.contains('on')) map.setTerrain({ source: 'dem', exaggeration: exageration });
});

document.getElementById('fond').addEventListener('change', e => {
  const sat = e.target.value === 'sat';
  map.setLayoutProperty('fond-sat', 'visibility', sat ? 'visible' : 'none');
  map.setLayoutProperty('fond-topo', 'visibility', sat ? 'none' : 'visible');
});

// ---------- survol animé ----------
let survolId = null;
function cap(i) {
  const a = P.coords[Math.max(0, i - 2)], b = P.coords[Math.min(P.coords.length - 1, i + 2)];
  return (Math.atan2(b[0] - a[0], b[1] - a[1]) * 180) / Math.PI;
}
document.getElementById('btn-survol').addEventListener('click', e => {
  if (survolId) { cancelAnimationFrame(survolId); survolId = null; e.target.classList.remove('on'); curseurMarker.remove(); curseurPose = false; return; }
  e.target.classList.add('on');
  const debut = performance.now(), duree = 45000;
  curseurMarker.addTo(map); curseurPose = true;
  const pas = now => {
    const t = Math.min(1, (now - debut) / duree);
    const i = Math.round(t * (P.coords.length - 1));
    const c = P.coords[i];
    map.jumpTo({ center: [c[0], c[1]], zoom: 15.2, pitch: 72, bearing: cap(i) });
    curseurMarker.setLngLat([c[0], c[1]]);
    if (t < 1) survolId = requestAnimationFrame(pas);
    else { survolId = null; e.target.classList.remove('on'); }
  };
  survolId = requestAnimationFrame(pas);
});

// ---------- coureur live simulé (ping GPS 10 min, point figé) ----------
let coureurMarker = null, liveId = null;
document.getElementById('btn-live').addEventListener('click', e => {
  if (liveId) {
    clearInterval(liveId); liveId = null; e.target.classList.remove('on');
    coureurMarker.remove(); coureurMarker = null;
    document.getElementById('note').textContent = noteInitiale;
    return;
  }
  e.target.classList.add('on');
  const el = document.createElement('div'); el.className = 'runner';
  coureurMarker = new maplibregl.Marker({ element: el }).setLngLat([P.coords[0][0], P.coords[0][1]]).addTo(map);
  let ping = 0;           // index du dernier ping reçu
  let minutes = 0;        // minutes écoulées depuis ce ping
  const avance = () => {  // 1 s réelle = 1 min de course, ping toutes les 10 min
    minutes++;
    if (minutes % 10 === 0) {
      ping = Math.min(P.coords.length - 1, ping + Math.round(P.coords.length / 18));
      const c = P.coords[ping];
      coureurMarker.setLngLat([c[0], c[1]]);
      coureurMarker.setPopup(new maplibregl.Popup({ offset: 12, closeButton: false })
        .setHTML(`<b>Dossard 42</b>km ${(P.profile[ping][0] / 1000).toFixed(1)} · ${Math.round(P.profile[ping][1])} m`));
      minutes = 0;
    }
    document.getElementById('note').textContent =
      `Dossard 42 — dernier ping GPS il y a ${minutes} min, km ${(P.profile[ping][0] / 1000).toFixed(1)}. Le point reste figé entre deux pings : aucune extrapolation.`;
  };
  liveId = setInterval(avance, 1000);
  avance();
});
const noteInitiale = document.getElementById('note').textContent;
</script>
</body>
</html>
